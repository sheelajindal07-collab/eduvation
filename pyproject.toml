[project]
name = "bcion-lite"
version = "0.1.0"
description = "BCION Lite — a 10-100 user career-decision pilot (BCION DPR v1.1, Annexes C-F)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic[email]>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27,<1.0",
    "supabase>=2.5,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    # M5 (app/ai/gemini_provider.py) — Google's current unified SDK for the
    # Gemini API (docs/DECISIONS.md, 2026-09-19, owner-confirmed provider).
    # Never invoked by this repo's own tests; see that module's docstring.
    "google-genai>=1.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-playwright>=0.9,<1.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's Depends()/Query()/Header() *must* be called in argument
# defaults — that's the framework's own dependency-injection idiom, not
# the mutable-default-argument bug this rule exists to catch.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
exclude = ["tests/"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
# Only `app` is an installable/importable Python package. Without this,
# setuptools' flat-layout auto-discovery sees db/ (migrations) as a
# second top-level "package" candidate and refuses to guess — caught by
# CI on the first real push, not locally (the editable install had only
# ever been run once, before db/ existed). scripts/ and tests/ are run
# in place (via `python scripts/...` / pytest), never imported as an
# installed package, so they're deliberately left out too.
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

name: CI

# BCION Lite CI skeleton (M0). Runs lint, typecheck and unit tests on every
# push/PR — no production secrets are available to this workflow (see
# docs/ARCHITECTURE.md "Deployment flow" and docs/DECISIONS.md). test-db
# and test-e2e stay commented out until a staging Postgres / UI exist
# (Lite Build Pack §9 milestones M1+); enabling them early would just fail red for
# lack of a target, which is noise, not signal.
#
# SEC-7: dependencies install only from the hashed, pinned lockfile
# (requirements-dev.lock, generated for Linux/py3.11 to match this
# runner — see that file's own header), plus a dependency audit
# (pip-audit) and a secret scan (gitleaks) run on every push/PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks-action scans a commit range (base^..head) on a push
          # event; actions/checkout's default fetch-depth: 1 doesn't
          # include the base commit, which fails as "unknown revision"
          # rather than as a real secret finding. Full history avoids it.
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Fails the job (and this whole workflow) on any finding — a
        # planted key on a scratch branch is expected to turn this red.

  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (hash-checked, from the lockfile)
        run: |
          pip install --require-hashes -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Dependency audit (pip-audit)
        run: pip-audit -r requirements-dev.lock
        # pip-audit is itself pinned+hashed in requirements-dev.lock
        # (dev extra) — installed above, not fetched ad hoc here. Any
        # known vulnerability fails this step; nothing is swallowed as
        # merely a warning.

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Typecheck (mypy)
        run: mypy app

      - name: Unit tests (pytest)
        run: pytest tests/unit -v

      - name: DB/RLS policy tests
        run: pytest tests/db -v
        # Skips cleanly (with a printed reason) until SUPABASE_URL,
        # SUPABASE_PUBLISHABLE_KEY and SUPABASE_SERVICE_ROLE_KEY are set as
        # repo secrets against a real staging project — see
        # db/migrations/README.md. Never silently green for a check that
        # didn't run: a skip prints in the job log, it isn't hidden.

      # - name: E2E tests (Playwright)
      #   run: make test-e2e
      #   # Needs a UI to drive — wire up after M1's first vertical slice.

# BCION Lite — nginx per-IP rate limiting (SEC-3).
#
# THIS IS A CONFIG SNIPPET, NOT A RUNNABLE SITE. There is no nginx
# deployment in front of this app yet (docs/DECISIONS.md / STATUS.md: the
# app currently runs directly, no reverse proxy in dev). This file exists
# to be wired into a future site config by whoever actually stands up
# nginx (DEPLOY-4 / DEPLOY-7) — it does nothing on its own.
#
# This is Layer 1 of two independent rate-limiting layers. Layer 2 is
# Supabase Auth's own, separate, server-side rate limiting on the auth
# endpoints this app calls — see docs/SECURITY.md, "Rate limiting
# (SEC-3)". Nothing here replaces that layer; it exists to blunt abuse
# BEFORE it reaches this app or Supabase at all, and to protect routes
# (the AI ask route, /plans writes) that Supabase's own limits know
# nothing about.
#
# No Redis, no in-app/Python-level limiter. This is nginx-only, entirely
# server memory (the `10m` zone sizes below), per the stack decision
# (no Redis/broker).
#
#
# === HOW TO WIRE THIS IN ==========================================
#
# Part A (below, active directives): `map`, `limit_req_zone`,
# `limit_conn_zone`, `limit_req_status`, `limit_conn_status` can ONLY be
# declared in the `http {}` context, never inside `server {}` or
# `location {}`. Add one line inside your site's `http {}` block
# (nginx.conf or a file it already includes at http scope):
#
#     http {
#         ...
#         include /path/to/this/repo/deploy/nginx/ratelimit.conf;
#         ...
#     }
#
# Part B (further down, inside the big comment block): the actual
# `limit_req` / `limit_conn` lines that apply a zone to a route. These
# MUST live inside a `location {}` block in your `server {}` — nginx has
# no "apply this rate limit to path X" directive that works outside a
# location, and this repo does not yet have a site file with those
# location blocks to include into (no deploy/nginx staging/prod template
# exists yet). Part B is therefore written as commented, copy-paste
# nginx syntax: copy each block into the matching `location` in your
# site file, then remove the leading `# ` on each line. It is left
# commented here specifically so that accidentally `include`-ing this
# whole file somewhere unexpected never produces a "location is not
# allowed here" syntax error.
#
# Real-IP caveat for whoever deploys this: `$binary_remote_addr` below is
# only the true client IP if nginx is the first hop. If this box ever
# sits behind another proxy/load balancer, add `set_real_ip_from` /
# `real_ip_header X-Forwarded-For;` (ngx_http_realip_module) pointing at
# that upstream BEFORE these zones do anything useful — otherwise every
# request collapses onto the load balancer's one IP and either
# rate-limits everyone together or nobody at all. Topology isn't known
# yet, so that is not configured here; whoever wires this in for real
# needs to add it.
#
#
# === THRESHOLDS CHOSEN, AND WHY =====================================
#
# Every number below is a judgement call, not a measured fact, and is
# meant for the owner to review/adjust. The guiding tension: a school or
# carrier NAT can put many real students behind a single public IP, and
# this pilot's whole point is those students — the limits have to
# tolerate a burst of genuinely simultaneous, independent humans on one
# IP without meaningfully slowing a real automated attack down.
#
# nginx's `rate` is the SUSTAINED long-run ceiling per IP; `burst` is how
# many requests past that can arrive back-to-back before anything is
# throttled at all; `nodelay` serves the whole burst immediately (no
# artificial queueing lag) and only rejects once burst is exhausted, so a
# legitimate crowd never *feels* rate limited, it just eventually meets a
# hard wall an automated loop keeps hitting.
#
# | Zone                | Protects                                   | rate (sustained) | burst | Reasoning |
# |----------------------|--------------------------------------------|------------------|-------|-----------|
# | `bcion_auth`         | `/auth/*`, `/reviewer/sign-in` (all methods)| 30r/m (1 per 2s) | 20, nodelay | Highest-value target for credential stuffing / enumeration / signup-email abuse. 30r/m sustained is far below anything a real human retyping a password produces, but the 20-request burst absorbs a classroom/lab of up to ~20 students signing in within the same couple of seconds (e.g. start of a session) without anyone getting a false 429. Sustained hammering past that burst is throttled hard — exactly what a credential-stuffing script does and a human doesn't. |
# | `bcion_plans_write`  | `/plans` and `/plans/*`, every method except GET/HEAD (via a `$request_method` map, not `limit_except` — see scope note below) | 60r/m (1/s) | 30, nodelay | Authenticated, already-signed-in traffic (saving/editing/deleting a plan, plan actions) — legitimate everyday use, so both numbers are looser than `bcion_auth`. A lab of concurrently active students saving plans at once needs a bigger burst than a login page does. 60/min sustained per IP is still well above normal single-user click-through pace but well below a scripted retry loop or a buggy client stuck resubmitting. |
# | `bcion_ask`          | `GET /ask` (exact path — read `app/api/ask.py`, this is the confirmed current route, no prefix) | 30r/m (0.5/s) | 15, nodelay | Deterministic-only today (canned templates, no model call), but this is the route the DPR's Tier-0/Tier-1 AI spend-control language is aimed at and the one AI-6 will eventually deepen — worth meaningfully throttling now rather than adding it later. The 15-request burst covers several students each loading a compare/requirements page's 2-3 canned "Ask BCION" prompts within a shared-IP window. |
# | `bcion_perip_conn`   | all three groups above (a shared `limit_conn` zone) | n/a — this is a *concurrent connection* cap, not a rate | max 20 simultaneous connections per IP per protected location | Bounds connection-exhaustion abuse (many parallel slow connections) without touching normal multi-tab, multi-student-per-IP browsing, which rarely holds anywhere near 20 concurrent open connections to one of these specific paths at once. Deliberately NOT method-filtered like `bcion_plans_write` above — a connection cap is a coarser resource protection, not the "only throttle writes" precision the request-rate zone needs, and 20 concurrent connections is generous enough that a GET-heavy shared IP is very unlikely to trip it. |
#
# Deliberate scope + implementation note on `/plans`: the task card asked
# for POST/PATCH/DELETE specifically. This router also exposes
# `PUT /plans/{plan_id}/actions/{action_key}` (a write the card's method
# list didn't name), so Part B excludes GET/HEAD rather than enumerating
# POST/PATCH/DELETE, to avoid silently leaving PUT unprotected. Flagged
# here for the owner to confirm that's the intended scope.
#
# The exclusion is done with a `map $request_method ...` producing an
# EMPTY limiter key for GET/HEAD (nginx's documented "empty key = not
# rate limited" behaviour for both `limit_req_zone` and `limit_conn_zone`
# keys) rather than nginx's `limit_except` block. This was found the hard
# way, not assumed: an earlier draft of this file used
# `limit_except GET { limit_req ...; }`, and running `nginx -t` against it
# in a local `nginx:stable` Docker container (this repo has no nginx
# binary installed) failed with `"limit_req" directive is not allowed
# here` — `limit_req`'s documented context is http/server/location only,
# not the `limit_except` block. The `map`-based empty-key technique below
# is the documented workaround and passed the same Docker `nginx -t`
# check afterwards.
#
# This file was also checked beyond `nginx -t` syntax validation: run for
# real in a local `nginx:stable` Docker container (no nginx binary is
# installed in this dev environment) with all four Part-B location blocks
# uncommented, and hit with real concurrent request bursts. Confirmed
# live: `GET /plans` passes unlimited (the empty-key map exclusion
# works), a rapid `POST /plans` burst passes exactly 31 requests
# (burst=30 + the 1 immediately-admitted request) before every
# subsequent request in the same burst gets **429**, with `app/static/
# 429.html`'s body served directly by nginx (not proxied), and `GET
# /ask` passes exactly 16 (burst=15 + 1) before the same 429 behaviour.
# One real bug was caught and fixed by this live test that `nginx -t`
# alone could never have caught: an earlier test stub used
# `return 200 ...;` as a stand-in content handler, which — because
# `return` executes in nginx's REWRITE phase — finalizes the request
# before the PREACCESS phase `limit_req`/`limit_conn` run in, silently
# never invoking the limiter at all. Switching the test stub to a
# content-phase handler (a static `try_files`, the same phase
# `proxy_pass` runs in) immediately showed the correct throttling
# behaviour above. This only affected the test stub, not these
# directives — `proxy_pass` in a real site file is itself a content-phase
# handler, so it was never at risk — but it's worth remembering if this
# config is ever re-tested with a `return`-only stub location again.
#
# `limit_req_status`/`limit_conn_status` are set to 429 (nginx's default
# for both is 503, which would misreport "server error" for what is
# actually "you're being throttled" — the friendly static page this
# pairs with, `app/static/429.html`, assumes the real 429 status).


# --- Part A: zone definitions (http-context; `include` this file inside
# your `http {}` block — see instructions above) -----------------------

limit_req_status 429;
limit_conn_status 429;

# Auth-family endpoints: /auth/sign-up, /auth/sign-in, /reviewer/sign-in.
# 10m ~ enough state for roughly 160k distinct IPs — comfortably more
# than this pilot's 10-100 user scale plus headroom for an actual attack.
limit_req_zone $binary_remote_addr zone=bcion_auth:10m rate=30r/m;

# /plans write methods (POST/PATCH/DELETE, and PUT on the actions
# sub-route — see the scope note above). GET/HEAD map to an empty key,
# which nginx's own documented convention treats as "do not rate limit
# this request" for both limit_req_zone and limit_conn_zone keys.
map $request_method $bcion_plans_write_key {
    default $binary_remote_addr;
    GET     "";
    HEAD    "";
}
limit_req_zone $bcion_plans_write_key zone=bcion_plans_write:10m rate=60r/m;

# GET /ask — the canned-prompt "Ask BCION" route.
limit_req_zone $binary_remote_addr zone=bcion_ask:10m rate=30r/m;

# Shared concurrent-connection cap across all three groups above
# (deliberately not method-filtered — see the table above).
limit_conn_zone $binary_remote_addr zone=bcion_perip_conn:10m;


# --- Part B: per-location usage (COMMENTED — copy into your site's
# `server {}` / `location {}` blocks, then uncomment; see instructions
# above for why this is not itself a working `include`) -----------------
#
# --- /auth/* (POST /auth/sign-up, POST /auth/sign-in) ---
#
# location /auth/ {
#     limit_req zone=bcion_auth burst=20 nodelay;
#     limit_conn bcion_perip_conn 20;
#     proxy_pass http://bcion_app;   # replace with your actual upstream name
# }
#
# --- /reviewer/sign-in (GET the form, POST the submission) ---
#
# location = /reviewer/sign-in {
#     limit_req zone=bcion_auth burst=20 nodelay;
#     limit_conn bcion_perip_conn 20;
#     proxy_pass http://bcion_app;
# }
#
# --- /plans and /plans/* — POST/PATCH/DELETE/PUT only; GET/HEAD pass
#     through unlimited via the empty-key map in Part A above ---
#
# location /plans {
#     limit_req zone=bcion_plans_write burst=30 nodelay;
#     limit_conn bcion_perip_conn 20;
#     proxy_pass http://bcion_app;
# }
#
# --- GET /ask (exact path — confirm against app/api/ask.py if this
#     route ever changes) ---
#
# location = /ask {
#     limit_req zone=bcion_ask burst=15 nodelay;
#     limit_conn bcion_perip_conn 20;
#     proxy_pass http://bcion_app;
# }
#
# --- Friendly static 429 page, served by nginx directly (not proxied
#     to the app — that's the point: it still works even when the app
#     or DB is what's under load), inside the same `server {}` block ---
#
# error_page 429 /429.html;
# location = /429.html {
#     root /path/to/this/repo/app/static;   # deploy-host path; DEPLOY-4/7 to set
#     internal;
# }
